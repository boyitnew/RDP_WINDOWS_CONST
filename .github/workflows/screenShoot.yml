name: RDP screenshoot

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to open in Chrome and capture'
        required: false
        default: 'https://www.coinpayu.com/login'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        run: |
          # Set your fixed password here
          $password = "*r96319631P-"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Set target URL
        shell: pwsh
        run: |
          echo "TARGET_URL=${{ inputs.target_url }}" >> $env:GITHUB_ENV

      - name: Ensure Google Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chromeCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $script:chrome = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $script:chrome) {
            Write-Host "Chrome not found, installing..."
            $msiUrl = "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi"
            $msiPath = "$env:TEMP\chrome.msi"
            Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
            Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
            $script:chrome = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $script:chrome) { throw "Google Chrome not found after install." }
          echo "CHROME_PATH=$script:chrome" >> $env:GITHUB_ENV

      - name: Launch Chrome (non-headless) with DevTools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chrome = $env:CHROME_PATH
          if (-not $chrome) { throw "CHROME_PATH not set" }
          $profileDir = "$env:TEMP\chrome-profile"
          if (-not (Test-Path $profileDir)) { New-Item -ItemType Directory -Force -Path $profileDir | Out-Null }
          $args = @(
            "--remote-debugging-port=9222",
            "--user-data-dir=$profileDir",
            "--no-first-run",
            "--no-default-browser-check",
            "--disable-gpu",
            "--start-maximized",
            "--new-window",
            $env:TARGET_URL
          )
          Start-Process -FilePath $chrome -ArgumentList $args | Out-Null

          # Wait for DevTools endpoint to become available
          $ok = $false
          for ($i=0; $i -lt 30; $i++) {
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:9222/json/version" -UseBasicParsing | Out-Null
              $ok = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { throw "Chrome DevTools endpoint didn't come up" }

      - name: Capture screenshot via Chrome DevTools (non-headless)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm --version
          npm init -y | Out-Null
          npm i --save-exact chrome-remote-interface@0.33.0
          @'
          import CDP from "chrome-remote-interface";
          import fs from "fs";

          async function main() {
            const url = process.env.TARGET_URL || "https://www.coinpayu.com/login";
            // Create new tab in existing Chrome instance
            const browser = await CDP({ host: "127.0.0.1", port: 9222 });
            const { Target } = browser;
            const { targetId } = await Target.createTarget({ url: "about:blank" });
            const client = await CDP({ host: "127.0.0.1", port: 9222, target: targetId });
            const { Page, Emulation } = client;
            await Page.enable();
            await Emulation.setDeviceMetricsOverride({ width: 1366, height: 768, deviceScaleFactor: 1, mobile: false });
            await Page.navigate({ url });
            await Page.loadEventFired();
            await new Promise(r => setTimeout(r, 50000));
            const { data } = await Page.captureScreenshot({ format: "png", fromSurface: true });
            fs.writeFileSync("screenshot.png", Buffer.from(data, "base64"));
            await client.close();
            await browser.close();
          }

          main().catch(err => { console.error(err); process.exit(1); });
          '@ | Set-Content -Path "screenshot.mjs" -Encoding UTF8

          node ".\screenshot.mjs"
          if (!(Test-Path "screenshot.png")) { throw "Screenshot not created" }
          echo "SCREENSHOT_PATH=$(Resolve-Path .\screenshot.png)" >> $env:GITHUB_ENV

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeir-screenshot
          path: screenshot.png
          retention-days: 7
          if-no-files-found: error

      - name: Log screenshot download page
        shell: pwsh
        run: |
          Write-Host "Target URL: $env:TARGET_URL"
          Write-Host "Screenshot saved at: $env:SCREENSHOT_PATH"
          Write-Host "Download from the run page (Artifacts -> timeir-screenshot):"
          Write-Host "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
